<script>
  (function () {
    const kpis = [['Total production orders','totalOrders',''],['Active orders','activeOrders',''],['Completed orders','completedOrders','success'],['Pending / ready tasks','pendingTasks','warning'],['In progress','inProgressTasks',''],['Overdue','overdueTasks','danger'],['Blocked','blockedTasks','danger'],['Completed today','completedToday','success'],['Production quantity','totalProductionQuantity',''],['Completed quantity','completedQuantity','success'],['Active / WIP quantity','activeWipQuantity','warning']];
    const byId = id => document.getElementById(id);
    const OTP_SESSION_STORAGE_KEY = 'garment-production-otp-session';
    let toastTimer = null;
    const getOtpSessionToken = () => window.sessionStorage.getItem(OTP_SESSION_STORAGE_KEY) || '';
    const clearOtpSession = () => window.sessionStorage.removeItem(OTP_SESSION_STORAGE_KEY);
    function runAuthenticated(action, args, onSuccess, onFailure) {
      const token = getOtpSessionToken();
      if (!token) { const error = new Error('Session unavailable.'); showOtpLogin('Sign in with your registered email to continue.'); if (onFailure) onFailure(error); return; }
      google.script.run.withSuccessHandler(onSuccess).withFailureHandler(error => {

    const escapeHtml = value => String(value || '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[char]));
    function setButtonLoading(button, isLoading, actionLabel) {
      if (!button) return;
      if (isLoading) {
        if (button.dataset.loading === 'true') return;
        button.dataset.loading = 'true';
        button.dataset.originalLabel = button.textContent;
        button.disabled = true;
        button.setAttribute('aria-busy', 'true');

        return;
      }

      button.removeAttribute('aria-busy');
      button.dataset.loading = 'false';
      button.textContent = button.dataset.originalLabel || button.textContent;
      delete button.dataset.originalLabel;
    }
    function showLoading(button, message) { setButtonLoading(button, true, message); }
    function hideLoading(button) { setButtonLoading(button, false); }
    function runWithButtonLoading(button, actionLabel, request, onSuccess, onFailure) {

        if (settled) return;
        settled = true;
        hideLoading(button);
        if (callback) callback(value);

      try { request(value => finish(onSuccess, value), error => finish(onFailure, error)); }
      catch (error) { finish(onFailure, error); }
    }
    function runAuthenticatedWithLoading(button, actionLabel, action, args, onSuccess, onFailure) {
      runWithButtonLoading(button, actionLabel, (success, failure) => runAuthenticated(action, args, success, failure), onSuccess, onFailure);
    }
    function hideToast() { if (toastTimer) window.clearTimeout(toastTimer); toastTimer = null; byId('toast').hidden = true; }
    function showToast(type, message) { const toast = byId('toast'); if (!toast) return; if (toastTimer) window.clearTimeout(toastTimer); byId('toast-icon').textContent = type === 'success' ? '✓' : '✕'; byId('toast-message').textContent = message; toast.className = 'toast toast-' + type; toast.hidden = false; if (type === 'success') toastTimer = window.setTimeout(hideToast, 4000); }
    function showSuccess(message) { showToast('success', message); }
    function showError(messageOrTarget) { const box = byId(messageOrTarget); if (box) { box.textContent = 'The request could not be completed. Review your input or contact an administrator.'; box.hidden = false; showToast('error', 'Server request failed. Please try again.'); return; } showToast('error', messageOrTarget || 'Server request failed. Please try again.'); }

    const empty = text => '<div class="empty-state">' + escapeHtml(text) + '</div>';

    function taskActions(task) { const actions = [['view','View task']]; if (['READY','OVERDUE'].includes(task.status)) actions.push(['start','Start']); if (task.status === 'IN_PROGRESS') actions.push(['progress','Update']); if (['READY','IN_PROGRESS'].includes(task.status)) actions.push(['hold','Hold']); if (['ON_HOLD','BLOCKED'].includes(task.status)) actions.push(['resume','Resume']); if (['READY','IN_PROGRESS','ON_HOLD'].includes(task.status)) actions.push(['block','Block']); if (task.status === 'IN_PROGRESS' || (task.status === 'OVERDUE' && task.startDate)) actions.push(['complete','Complete']); return actions.map(([action,label]) => '<button class="button' + (action === 'complete' ? ' button-primary' : '') + '" data-action="' + action + '" data-task="' + escapeHtml(task.taskId) + '">' + label + '</button>').join(''); }

    function alertRows(alerts, departmentView) { return alerts.length ? alerts.map(alert => '<tr><td><span class="badge status-' + escapeHtml(alert.severity) + '">' + escapeHtml(alert.severity) + '</span></td>' + (departmentView ? '' : '<td>' + escapeHtml(alert.departmentName || 'All') + '</td>') + '<td>' + escapeHtml(alert.orderId || '—') + '</td><td>' + escapeHtml(alert.deadline || '—') + '</td><td>' + Number(alert.delayHours || 0).toLocaleString() + ' h</td><td>' + escapeHtml(alert.message) + '</td><td>' + escapeHtml(alert.status) + '</td><td>' + (alert.status === 'OPEN' ? '<button class="button" data-alert-action="ack" data-alert="' + escapeHtml(alert.alertId) + '">Acknowledge</button>' : '') + '</td></tr>').join('') : '<tr><td colspan="' + (departmentView ? 7 : 8) + '" class="empty-state">No active alerts.</td></tr>'; }
    function loadAdminAlerts() { runAuthenticated('listAlerts', [], alerts => { if (!Array.isArray(alerts)) { showError('dashboard-error'); return; } byId('admin-alert-list').innerHTML = alertRows(alerts.filter(alert => alert.status !== 'RESOLVED'), false); }, error => showError('dashboard-error', error)); }

    function loadOrderMasters() { const product = byId('order-product'), customer = byId('order-customer'); product.innerHTML = '<option value="">Loading active products…</option>'; customer.innerHTML = '<option value="">Loading active customers…</option>'; runAuthenticated('listProducts', [], items => { const active = items.filter(item => item.Active === true || String(item.Active).toUpperCase() === 'TRUE'); product.innerHTML = '<option value="">Select an active product</option>' + active.map(item => '<option value="' + escapeHtml(item['Product ID']) + '">' + escapeHtml(item['Product Name']) + '</option>').join(''); }, error => showError('order-form-error', error)); runAuthenticated('listCustomers', [], items => { const active = items.filter(item => item.Active === true || String(item.Active).toUpperCase() === 'TRUE'); customer.innerHTML = '<option value="">Select an active customer</option>' + active.map(item => '<option value="' + escapeHtml(item['Customer ID']) + '">' + escapeHtml(item['Customer Name']) + '</option>').join(''); }, error => showError('order-form-error', error)); }

    function submitOrder(event) { event.preventDefault(); const form = byId('order-form'); const submit = form.querySelector('button[type="submit"]'); const values = Object.fromEntries(new FormData(form).entries()); values.quantity = Number(values.quantity); byId('order-form-error').hidden = true; byId('dashboard-success').hidden = true; runAuthenticatedWithLoading(submit, 'Creating order…', 'createProductionOrder', [values], result => { byId('order-dialog').close(); form.reset(); const orderId = result && result.order && result.order.orderId ? result.order.orderId : 'the new order'; byId('dashboard-success').textContent = 'Production workflow created successfully for ' + orderId + '.'; byId('dashboard-success').hidden = false; showSuccess('Order created successfully. Purchase workflow has been activated.'); loadDashboard(); }, error => showActionError('order-form-error', 'Unable to create order. Please try again.')); }
    const userState = { users: [] };

    const masterFields = { product: [['productName','Product name','text',true],['category','Category','text'],['garmentType','Garment type','text'],['fabricType','Fabric type','text'],['size','Size','text'],['color','Color','text'],['unit','Unit','text'],['standardProductionTimeHours','Standard production time (hours)','number'],['costPrice','Cost price','number'],['sellingPrice','Selling price','number']], customer: [['customerName','Customer name','text',true],['contactName','Contact person','text'],['phone','Phone','text'],['email','Email','email'],['address','Address','text']] };

    function loadMasters(type) { const plural = type + 's'; byId(plural + '-error').hidden = true; byId(plural + '-list').innerHTML = '<tr><td colspan="7" class="empty-state">Loading ' + plural + '…</td></tr>'; const api = type === 'product' ? 'listProducts' : 'listCustomers'; runAuthenticated(api, [], records => { if (!Array.isArray(records)) { showError(plural + '-error'); return; } masterState.type = type; masterState.records = records; const rows = records.map(record => { const active = record.Active === true || String(record.Active).toUpperCase() === 'TRUE'; const details = type === 'product' ? [record['Product Name'],record.Category,record['Garment Type'],record.Unit] : [record['Customer Name'],record['Contact Name'],record.Email,record.Phone]; return '<tr><td><strong>' + escapeHtml(details[0]) + '</strong></td><td>' + escapeHtml(details[1] || '—') + '</td><td>' + escapeHtml(details[2] || '—') + '</td><td>' + escapeHtml(details[3] || '—') + '</td><td><span class="badge status-' + (active ? 'GREEN' : 'OVERDUE') + '">' + (active ? 'ACTIVE' : 'INACTIVE') + '</span></td><td>' + escapeHtml(record['Updated Date'] || '—') + '</td><td><div class="user-actions"><button class="button" type="button" data-master-action="edit" data-master="' + escapeHtml(record[masterKeys[type].id]) + '">Edit</button><button class="button" type="button" data-master-action="' + (active ? 'deactivate' : 'activate') + '" data-master="' + escapeHtml(record[masterKeys[type].id]) + '">' + (active ? 'Deactivate' : 'Activate') + '</button></div></td></tr>'; }).join(''); byId(plural + '-list').innerHTML = rows || '<tr><td colspan="7" class="empty-state">No ' + plural + ' found.</td></tr>'; }, error => { byId(plural + '-list').innerHTML = ''; showError(plural + '-error', error); }); }
    function openMasterDialog(type, record) { masterState.type = type; const form = byId('master-form'); form.reset(); byId('master-form-error').hidden = true; byId('master-id').value = record ? record[masterKeys[type].id] : ''; byId('master-dialog-title').textContent = (record ? 'Edit ' : 'Add ') + type; byId('master-fields').innerHTML = masterFields[type].map(([key,label,inputType,required]) => '<label>' + label + '<input name="' + key + '" type="' + inputType + '"' + (required ? ' required' : '') + '></label>').join('') + '<label><input name="active" type="checkbox" checked> Active</label>'; masterFields[type].forEach(([key]) => { if (record) form.elements[key].value = record[({productName:'Product Name',garmentType:'Garment Type',fabricType:'Fabric Type',standardProductionTimeHours:'Standard Production Time Hours',costPrice:'Cost Price',sellingPrice:'Selling Price',customerName:'Customer Name',contactName:'Contact Name',phone:'Phone',email:'Email',address:'Address',category:'Category',size:'Size',color:'Color',unit:'Unit'})[key]] || ''; }); form.elements.active.checked = record ? (record.Active === true || String(record.Active).toUpperCase() === 'TRUE') : true; byId('master-dialog').showModal(); }
    function submitMaster(event) { event.preventDefault(); const type = masterState.type, form = byId('master-form'), values = Object.fromEntries(new FormData(form).entries()); values.active = form.elements.active.checked; const id = byId('master-id').value; if (id) values[type === 'product' ? 'productId' : 'customerId'] = id; const api = type === 'product' ? 'saveProduct' : 'saveCustomer'; runAuthenticatedWithLoading(byId('save-master'), 'Saving…', api, [values], () => { byId('master-dialog').close(); showSuccess(type === 'product' ? 'Product saved successfully.' : 'Customer saved successfully.'); loadMasters(type); }, error => showActionError('master-form-error', type === 'product' ? 'Unable to save product. Please try again.' : 'Unable to save customer. Please try again.')); }

    function renderUsers(users) { if (!Array.isArray(users)) { showError('users-error'); return; } userState.users = users; byId('users-list').innerHTML = users.length ? users.map(user => '<tr><td><strong>' + escapeHtml(user.displayName) + '</strong></td><td>' + escapeHtml(user.email) + '</td><td>' + escapeHtml(user.role) + '</td><td>' + escapeHtml(user.departmentName || '—') + '</td><td><span class="badge status-' + (user.active ? 'GREEN' : 'OVERDUE') + '">' + (user.active ? 'ACTIVE' : 'INACTIVE') + '</span></td><td>' + escapeHtml(user.updatedDate || '—') + '</td><td><div class="user-actions"><button class="button" type="button" data-user-action="edit" data-user="' + escapeHtml(user.userId) + '">Edit</button><button class="button" type="button" data-user-action="' + (user.active ? 'deactivate' : 'activate') + '" data-user="' + escapeHtml(user.userId) + '">' + (user.active ? 'Deactivate' : 'Activate') + '</button></div></td></tr>').join('') : '<tr><td colspan="7" class="empty-state">No users found.</td></tr>'; }
