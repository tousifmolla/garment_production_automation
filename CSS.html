<style>
  :root{--navy:#102a43;--blue:#1769aa;--surface:#ffffff;--page:#f4f7fb;--text:#1f2933;--muted:#6b7280;--line:#d9e2ec;--green:#16803a;--amber:#b7791f;--red:#c53030;--purple:#6b46c1}
  [hidden]{display:none!important}.access-screen{min-height:100vh;display:grid;place-items:center;padding:24px}.access-card{display:flex;align-items:center;gap:12px;padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:8px}.access-card p{margin:0}
  *{box-sizing:border-box} body{margin:0;background:var(--page);color:var(--text);font:14px/1.45 Arial,sans-serif}.app-shell{min-height:100vh;display:flex}.sidebar{width:250px;background:var(--navy);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;padding:0 8px}.brand-mark{display:grid;place-items:center;width:30px;height:30px;background:#2d8ac7;border-radius:7px;font-size:12px}nav{display:grid;gap:4px}.nav-item{border:0;background:transparent;color:#d9e2ec;text-align:left;padding:10px 12px;border-radius:6px;font:inherit;cursor:pointer}.nav-item.active{background:#243f5c;color:#fff;font-weight:700}.nav-item:disabled{cursor:not-allowed;opacity:.62}.nav-item small{float:right;font-size:10px}.profile{margin-top:auto;border-top:1px solid #486581;padding:16px 8px 0;color:#d9e2ec;font-size:12px}.main-content{width:calc(100% - 250px);padding:30px;position:relative}.page-header,.section-heading{display:flex;justify-content:space-between;gap:16px;align-items:center}.page-header{margin-bottom:24px}.eyebrow{margin:0;color:var(--blue);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}h1,h2,p{margin-top:0}h1{margin-bottom:4px;font-size:28px}h2{margin-bottom:2px;font-size:17px}.muted,.section-heading p{color:var(--muted);margin-bottom:0}.button{border:1px solid var(--line);padding:9px 14px;border-radius:6px;background:#fff;font-weight:700;cursor:pointer}.button-primary{background:var(--blue);color:#fff;border-color:var(--blue)}.button:disabled{opacity:.65;cursor:wait}.kpi-grid{display:grid;grid-template-columns:repeat(5,minmax(145px,1fr));gap:14px;margin-bottom:24px}.kpi-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}.kpi-label{color:var(--muted);font-size:12px;margin-bottom:8px}.kpi-value{font-size:25px;font-weight:700}.kpi-card[data-tone="warning"] .kpi-value{color:var(--amber)}.kpi-card[data-tone="danger"] .kpi-value{color:var(--red)}.kpi-card[data-tone="success"] .kpi-value{color:var(--green)}.dashboard-section{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px;margin-bottom:22px}.table-wrap{overflow-x:auto;margin-top:15px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}td:not(:first-child){font-variant-numeric:tabular-nums}.dashboard-split{display:grid;grid-template-columns:1fr 1fr;gap:22px}.alert-list,.order-list{display:grid;gap:10px;margin-top:15px}.alert-item,.order-item{padding:12px;background:#f8fafc;border-left:4px solid var(--line);border-radius:4px}.alert-item.level-RED,.alert-item.level-BLOCKED{border-left-color:var(--red)}.alert-item.level-YELLOW{border-left-color:var(--amber)}.alert-title,.order-title{font-weight:700;margin-bottom:3px}.alert-meta,.order-meta{color:var(--muted);font-size:12px}.progress-track{height:7px;background:#e5edf5;border-radius:4px;margin-top:9px;overflow:hidden}.progress-fill{height:100%;background:var(--blue);border-radius:4px}.badge{display:inline-block;border-radius:999px;padding:2px 7px;font-size:11px;font-weight:700;background:#e6f6ec;color:var(--green)}.badge.status-OVERDUE,.badge.status-BLOCKED{background:#fee2e2;color:var(--red)}.badge.status-PENDING,.badge.status-READY{background:#fff5d6;color:var(--amber)}.empty-state{color:var(--muted);padding:20px 0;text-align:center}.message{padding:12px;border-radius:6px;margin-bottom:18px}.message-error{background:#fee2e2;color:#9b1c1c}.loading-overlay{display:none;position:absolute;inset:0;background:rgba(244,247,251,.78);align-items:center;justify-content:center;gap:10px;font-weight:700}.loading-overlay.visible{display:flex}.spinner{width:20px;height:20px;border:3px solid #bcd4e6;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{
